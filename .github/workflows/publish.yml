name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest-11

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify version is not already published
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view "$PKG_NAME" version 2>/dev/null || true)"

          echo "Package: $PKG_NAME"
          echo "Local version: $PKG_VERSION"
          echo "Published version: ${PUBLISHED_VERSION:-<none>}"

          if [[ "$PUBLISHED_VERSION" == "$PKG_VERSION" ]]; then
            echo "Version $PKG_VERSION is already published. Bump package.json version before tagging/publishing."
            exit 1
          fi

      - name: Publish preflight (trusted publishing)
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          npm --version
          npm view "$PKG_NAME" name version --json

      - name: Publish to npm (trusted publishing)
        shell: bash
        run: npm publish --provenance --access public
