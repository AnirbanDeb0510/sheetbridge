name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify version is not already published
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view "$PKG_NAME" version 2>/dev/null || true)"

          echo "Package: $PKG_NAME"
          echo "Local version: $PKG_VERSION"
          echo "Published version: ${PUBLISHED_VERSION:-<none>}"

          if [[ "$PUBLISHED_VERSION" == "$PKG_VERSION" ]]; then
            echo "Version $PKG_VERSION is already published. Bump package.json version before tagging/publishing."
            exit 1
          fi

      - name: Publish preflight
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          node --version
          npm --version
          npm view "$PKG_NAME" name version --json

      - name: Trusted publishing diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Workflow ref: ${GITHUB_WORKFLOW_REF}"
          echo "Tag ref: ${GITHUB_REF}"
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "OIDC token endpoint is unavailable. Check workflow permissions: id-token: write"
            exit 1
          fi

      - name: Publish to npm (trusted publishing)
        shell: bash
        run: npm publish --access public
